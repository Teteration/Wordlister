[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "target-wordlister"
version = "0.2.0"
description = "Build target-specific wordlists from URLs and bounded HTTP responses."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Teteration" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pip-audit>=2.7,<3",
  "ruff>=0.9,<1",
]

[project.scripts]
wordlister = "wordlister_core.cli:main"

[project.urls]
Homepage = "https://github.com/Teteration/Wordlister"
Issues = "https://github.com/Teteration/Wordlister/issues"
Repository = "https://github.com/Teteration/Wordlister.git"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"wordlister.py" = ["E402"]